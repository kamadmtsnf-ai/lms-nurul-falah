name: Encrypted production backup
on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: bash scripts/operations/install-pg-clients.sh
      - name: Export encrypted database and private Storage to private destination
        run: node scripts/operations/backup-run.mjs
        env:
          PGHOST: ${{ secrets.LMS_BACKUP_PGHOST }}
          PGPORT: ${{ secrets.LMS_BACKUP_PGPORT }}
          PGDATABASE: postgres
          PGUSER: ${{ secrets.LMS_BACKUP_PGUSER }}
          PGPASSWORD: ${{ secrets.LMS_BACKUP_PGPASSWORD }}
          LMS_BACKUP_KEY_BASE64: ${{ secrets.LMS_BACKUP_KEY_BASE64 }}
          SUPABASE_SECRET_KEY: ${{ secrets.LMS_BACKUP_SUPABASE_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.LMS_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LMS_BACKUP_SECRET_ACCESS_KEY }}
          LMS_BACKUP_BUCKET: ${{ vars.LMS_BACKUP_BUCKET }}
          LMS_BACKUP_ENDPOINT: ${{ vars.LMS_BACKUP_ENDPOINT }}
          AWS_DEFAULT_REGION: ${{ vars.LMS_BACKUP_REGION }}
          LMS_BACKUP_DESTINATION_ACK: ${{ vars.LMS_BACKUP_DESTINATION_ACK }}
